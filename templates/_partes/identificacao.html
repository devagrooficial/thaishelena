<div class="sec">1. Dados de identificação do cliente</div>
<div class="grid">
  <div class="full"><label for="nome">Nome completo</label><input class="in" id="nome"></div>
  <div><label for="cpf">CPF</label><input class="in" id="cpf" placeholder="000.000.000-00" maxlength="14"></div>
  <div><label for="nascimento">Data de nascimento</label><input class="in" type="date" id="nascimento"></div>
  <div><label for="idade">Idade</label><input class="in" id="idade" readonly tabindex="-1" placeholder="Calculada pela data de nascimento"></div>
  <div><label for="telefone">Telefone / WhatsApp</label><input class="in" id="telefone"></div>
  <div class="full"><label>Sexo</label>
    <div class="chk">
      <label><input type="radio" name="sexo" id="sx_f"> Feminino</label>
      <label><input type="radio" name="sexo" id="sx_m"> Masculino</label>
    </div>
  </div>
  <div class="full"><label for="endereco">Endereço</label><input class="in" id="endereco"></div>
  <div class="full"><label for="instagram">Rede social / Instagram</label><input class="in" id="instagram" placeholder="@"></div>
</div>
